<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Canteen App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center">
    <button onclick="history.back()" class="back-btn">⬅️ Back</button>
    <a href="register.html" style="position: absolute; top: 15px; right: 20px; color: #38bdf8; text-decoration: none; font-weight: bold; background: rgba(56, 189, 248, 0.1); padding: 8px 12px; border-radius: 8px; border: 1px solid #38bdf8; transition: all 0.3s;">📝 New User? Register</a>

    <div class="login-box">

        <!-- Logo (optional) -->
        <img src="images/logo.png.png" class="logo-center" alt="Logo">

        <h2>Login</h2>

        <input type="text" id="username" placeholder="Student Name">
        <input type="password" id="password" placeholder="PASSWORD">

        <select id="role">
            <option value="student">Student</option>
            <option value="vendor">Vendor</option>
            <option value="admin">Admin</option>
        </select>

        <button onclick="login()">Secure Login 🔐</button>
    </div>

    <!-- VERY IMPORTANT -->
    <script src="script.js"></script>
</body>
</html>
